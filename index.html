<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Absensi QR Live</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

body{
    margin:0;
    padding:15px;
    font-family:Arial,sans-serif;
    background:#f1f5f9;
}

.container{
    max-width:500px;
    margin:auto;
}

.card{
    background:white;
    padding:20px;
    border-radius:18px;
    box-shadow:0 4px 15px rgba(0,0,0,.12);
}

h1{
    text-align:center;
}

.subtitle{
    text-align:center;
    color:#666;
}

#reader{
    width:100%;
    margin-top:20px;
}

.status{
    margin-top:15px;
    padding:15px;
    border-radius:12px;
    text-align:center;
    font-weight:bold;
}

.info{
    background:#dbeafe;
    color:#1e40af;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.warning{
    background:#fef3c7;
    color:#92400e;
}

.hasil{
    margin-top:15px;
    padding:15px;
    background:#f8fafc;
    border-radius:10px;
    line-height:1.8;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:0;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:17px;
    font-weight:bold;
}

.hidden{
    display:none;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>📋 ABSENSI QR</h1>

<div class="subtitle">
Kamera tetap aktif untuk scan berulang
</div>

<div id="reader"></div>

<div id="status"
class="status info">

📷 Tekan MULAI KAMERA

</div>

<div id="hasil"
class="hasil hidden">
</div>

<button
id="startButton"
onclick="startCamera()">

📷 MULAI KAMERA

</button>

</div>

</div>


<script>

/*
====================================================
APPS SCRIPT BARU
====================================================
*/

const API_URL =
"https://script.google.com/macros/s/AKfycbwd3HoNTw4igYBKxjsJoNuQtWQmprQuSAcj32nLiUl3hYZU61Yb14LbTXnIq-5IwYYgdg/exec";


let scanner = null;

let sedangProses = false;

let kameraAktif = false;


/*
====================================================
STATUS
====================================================
*/

function setStatus(text,type){

    const status =
    document.getElementById("status");

    status.innerHTML = text;

    status.className =
    "status " + type;
}


/*
====================================================
MULAI KAMERA
====================================================
*/

function startCamera(){

    if(kameraAktif){
        return;
    }

    setStatus(
        "⏳ Membuka kamera...",
        "info"
    );


    scanner =
    new Html5Qrcode("reader");


    const config = {

        fps:10,

        qrbox:{
            width:250,
            height:250
        },

        aspectRatio:1.0

    };


    scanner.start(

        {facingMode:"environment"},

        config,

        function(decodedText){

            if(sedangProses){
                return;
            }

            sedangProses = true;

            console.log(
                "QR TERBACA:",
                decodedText
            );


            kirimServer(decodedText);

        },

        function(errorMessage){

            // abaikan error scanner

        }

    )

    .then(function(){

        kameraAktif = true;

        setStatus(
            "🟢 KAMERA LIVE<br>" +
            "Arahkan QR ke kotak",
            "success"
        );

    })

    .catch(function(){

        scanner = null;

        bukaKameraFallback();

    });

}


/*
====================================================
FALLBACK CAMERA
====================================================
*/

function bukaKameraFallback(){

    setStatus(
        "⏳ Mencari kamera...",
        "info"
    );


    Html5Qrcode
    .getCameras()

    .then(function(cameras){

        if(!cameras || cameras.length === 0){

            setStatus(
                "❌ Tidak ada kamera.",
                "error"
            );

            return;
        }


        scanner =
        new Html5Qrcode("reader");


        scanner.start(

            cameras[0].id,

            {
                fps:10,

                qrbox:{
                    width:250,
                    height:250
                }
            },

            function(decodedText){

                if(sedangProses){
                    return;
                }

                sedangProses = true;

                kirimServer(decodedText);

            },

            function(errorMessage){

                // abaikan

            }

        )

        .then(function(){

            kameraAktif = true;

            setStatus(
                "🟢 KAMERA LIVE<br>" +
                "Arahkan QR ke kotak",
                "success"
            );

        })

        .catch(function(error){

            scanner = null;

            setStatus(
                "❌ Kamera gagal dibuka<br><br>" +
                error,
                "error"
            );

        });

    })

    .catch(function(error){

        setStatus(
            "❌ Tidak dapat mengakses kamera<br><br>" +
            error,
            "error"
        );

    });

}


/*
====================================================
KIRIM KE SERVER
====================================================
*/

function kirimServer(kode){

    setStatus(
        "⏳ QR TERBACA<br>" +
        "Memeriksa server...",
        "info"
    );


    const callbackName =
    "absensi_" + Date.now();


    window[callbackName] =
    function(data){

        console.log(
            "SERVER:",
            data
        );


        tampilkanHasil(data);


        delete window[callbackName];

    };


    const script =
    document.createElement("script");


    script.src =
    API_URL +
    "?action=absen" +
    "&id=" +
    encodeURIComponent(kode) +
    "&callback=" +
    callbackName;


    script.onerror =
    function(){

        setStatus(
            "❌ SERVER TIDAK TERHUBUNG",
            "error"
        );

        delete window[callbackName];


        setTimeout(function(){

            sedangProses = false;

            setStatus(
                "🟢 KAMERA LIVE<br>" +
                "Silakan scan QR berikutnya",
                "success"
            );

        },2000);

    };


    document.body.appendChild(script);

}


/*
====================================================
HASIL ABSENSI
====================================================
*/

function tampilkanHasil(data){

    const hasil =
    document.getElementById("hasil");


    hasil.classList.remove("hidden");


    if(data.success){

        setStatus(
            "✅ ABSENSI BERHASIL<br>" +
            "Kamera tetap LIVE",
            "success"
        );


        hasil.innerHTML =

        "<b>ID:</b> " +
        aman(data.id) +

        "<br><b>Nama:</b> " +
        aman(data.nama) +

        "<br><b>Kelas:</b> " +
        aman(data.kelas) +

        "<br><b>Tanggal:</b> " +
        aman(data.tanggal) +

        "<br><b>Jam:</b> " +
        aman(data.jam);

    }


    else if(data.duplicate){

        setStatus(
            "⚠️ SUDAH ABSEN<br>" +
            "Kamera tetap LIVE",
            "warning"
        );


        hasil.innerHTML =

        "<b>Nama:</b> " +
        aman(data.nama) +

        "<br><b>Kelas:</b> " +
        aman(data.kelas) +

        "<br><br>" +

        "Siswa sudah melakukan " +
        "absensi hari ini.";

    }


    else{

        setStatus(
            "❌ ABSENSI GAGAL<br>" +
            "Kamera tetap LIVE",
            "error"
        );


        hasil.innerHTML =
        aman(data.message);

    }


    /*
    ================================================
    SIAP SCAN BERIKUTNYA
    ================================================
    */

    setTimeout(function(){

        hasil.classList.add("hidden");

        sedangProses = false;

        setStatus(
            "🟢 KAMERA LIVE<br>" +
            "Silakan scan QR berikutnya",
            "success"
        );

    },2500);

}


/*
====================================================
AMANKAN TEXT
====================================================
*/

function aman(text){

    if(
        text === undefined ||
        text === null
    ){
        return "";
    }

    return String(text)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
