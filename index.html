<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Absensi QR</title>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
body {
  margin: 0;
  padding: 15px;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
}

.container {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 18px;
  box-shadow: 0 4px 15px rgba(0,0,0,.12);
}

h1 {
  text-align: center;
}

.subtitle {
  text-align: center;
  color: #666;
}

#reader {
  width: 100%;
  margin-top: 20px;
}

.status {
  margin-top: 20px;
  padding: 15px;
  border-radius: 12px;
  text-align: center;
  font-weight: bold;
}

.info {
  background: #dbeafe;
  color: #1e40af;
}

.success {
  background: #dcfce7;
  color: #166534;
}

.error {
  background: #fee2e2;
  color: #991b1b;
}

.warning {
  background: #fef3c7;
  color: #92400e;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border: none;
  border-radius: 10px;
  background: #2563eb;
  color: white;
  font-size: 17px;
  font-weight: bold;
}

.student {
  margin-top: 15px;
  padding: 15px;
  background: #f8fafc;
  border-radius: 10px;
}

.hidden {
  display: none;
}
</style>

</head>

<body>

<div class="container">

<h1>📋 ABSENSI QR</h1>

<div class="subtitle">
Scan QR siswa untuk melakukan absensi
</div>

<div id="reader"></div>

<div id="status" class="status info">
📷 Tekan MULAI SCAN
</div>

<div id="hasil" class="student hidden"></div>

<button onclick="mulaiKamera()">
📷 MULAI SCAN
</button>

</div>

<script>

// =================================================
// APPS SCRIPT BARU
// =================================================

const API_URL =
"https://script.google.com/macros/s/AKfycbwd3HoNTw4igYBKxjsJoNuQtWQmprQuSAcj32nLiUl3hYZU61Yb14LbTXnIq-5IwYYgdg/exec";


// =================================================
// VARIABEL
// =================================================

let scanner = null;
let sedangScan = false;


// =================================================
// STATUS
// =================================================

function setStatus(text, type) {

  const el = document.getElementById("status");

  el.innerHTML = text;

  el.className = "status " + type;
}


// =================================================
// KAMERA
// =================================================

function mulaiKamera() {

  if (scanner !== null) {
    return;
  }

  sedangScan = false;

  setStatus(
    "⏳ Membuka kamera...",
    "info"
  );

  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: 250
    },

    function(decodedText) {

      if (sedangScan) {
        return;
      }

      sedangScan = true;

      console.log(
        "QR:",
        decodedText
      );

      scanBerhasil(decodedText);

    },

    function(errorMessage) {

      // abaikan error scanning

    }

  )

  .then(function() {

    setStatus(
      "🟢 KAMERA AKTIF<br>Arahkan QR ke kotak",
      "success"
    );

  })

  .catch(function(error) {

    console.error(
      "CAMERA ERROR:",
      error
    );

    scanner = null;

    setStatus(
      "❌ KAMERA GAGAL DIBUKA<br><br>" +
      "Error: " +
      error,
      "error"
    );

  });

}


// =================================================
// QR BERHASIL DIBACA
// =================================================

function scanBerhasil(kode) {

  setStatus(
    "⏳ QR TERBACA<br>Memeriksa server...",
    "info"
  );


  if (scanner) {

    scanner.stop()

      .then(function() {

        scanner.clear();

        scanner = null;

        kirimKeServer(kode);

      })

      .catch(function() {

        scanner = null;

        kirimKeServer(kode);

      });

  }

  else {

    kirimKeServer(kode);

  }

}


// =================================================
// KIRIM KE APPS SCRIPT
// =================================================

function kirimKeServer(kode) {

  const callback =
    "absensi_" +
    Date.now();


  window[callback] =
    function(data) {

      console.log(
        "SERVER:",
        data
      );

      tampilkanHasil(data);

      delete window[callback];

    };


  const script =
    document.createElement("script");


  script.src =
    API_URL +
    "?action=absen" +
    "&id=" +
    encodeURIComponent(kode) +
    "&callback=" +
    callback;


  script.onerror =
    function() {

      setStatus(
        "❌ TIDAK TERHUBUNG KE SERVER",
        "error"
      );

      delete window[callback];

      setTimeout(
        mulaiLagi,
        3000
      );

    };


  document.body.appendChild(script);

}


// =================================================
// HASIL
// =================================================

function tampilkanHasil(data) {

  const hasil =
    document.getElementById("hasil");


  hasil.classList.remove("hidden");


  if (data.success) {

    setStatus(
      "✅ ABSENSI BERHASIL",
      "success"
    );


    hasil.innerHTML = `

      <b>ID:</b> ${aman(data.id)}<br>
      <b>Nama:</b> ${aman(data.nama)}<br>
      <b>Kelas:</b> ${aman(data.kelas)}<br>
      <b>Tanggal:</b> ${aman(data.tanggal)}<br>
      <b>Jam:</b> ${aman(data.jam)}

    `;

  }

  else if (data.duplicate) {

    setStatus(
      "❌ SUDAH ABSEN",
      "warning"
    );


    hasil.innerHTML = `

      <b>Nama:</b> ${aman(data.nama)}<br>
      <b>Kelas:</b> ${aman(data.kelas)}<br><br>

      Siswa sudah melakukan
      absensi hari ini.

    `;

  }

  else {

    setStatus(
      "❌ ABSENSI GAGAL",
      "error"
    );


    hasil.innerHTML =
      aman(data.message);

  }


  setTimeout(
    mulaiLagi,
    4000
  );

}


// =================================================
// MULAI SCAN LAGI
// =================================================

function mulaiLagi() {

  document
    .getElementById("hasil")
    .classList
    .add("hidden");

  sedangScan = false;

  setStatus(
    "📷 Siap scan berikutnya",
    "info"
  );

  scanner = null;

}


// =================================================
// AMANKAN TEKS
// =================================================

function aman(text) {

  if (
    text === null ||
    text === undefined
  ) {
    return "";
  }

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
