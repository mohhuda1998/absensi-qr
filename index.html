<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Absensi QR</title>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
}

.container {
  max-width: 500px;
  margin: auto;
  background: white;
  border-radius: 18px;
  padding: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,.12);
}

h1 {
  text-align: center;
  margin-top: 5px;
}

.subtitle {
  text-align: center;
  color: #666;
}

#reader {
  width: 100%;
  margin-top: 20px;
}

.status {
  margin-top: 20px;
  padding: 16px;
  border-radius: 12px;
  text-align: center;
  font-weight: bold;
  background: #eeeeee;
}

.success {
  background: #dcfce7;
  color: #166534;
}

.error {
  background: #fee2e2;
  color: #991b1b;
}

.warning {
  background: #fef3c7;
  color: #92400e;
}

.info {
  background: #dbeafe;
  color: #1e40af;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border: none;
  border-radius: 10px;
  background: #2563eb;
  color: white;
  font-size: 17px;
  font-weight: bold;
}

.student {
  margin-top: 15px;
  text-align: left;
  background: #f8fafc;
  padding: 15px;
  border-radius: 10px;
}

.student div {
  margin: 6px 0;
}

.hidden {
  display: none;
}

</style>

</head>

<body>

<div class="container">

<h1>📋 ABSENSI QR</h1>

<div class="subtitle">
Scan QR siswa untuk melakukan absensi
</div>

<div id="reader"></div>

<div id="status" class="status info">
📷 Tekan tombol untuk membuka kamera
</div>

<div id="hasil" class="student hidden"></div>

<button onclick="mulaiScanner()" id="btnScan">
📷 MULAI SCAN
</button>

</div>

<script>

// ======================================
// URL APPS SCRIPT ANDA
// ======================================

const API_URL =
"https://script.google.com/macros/s/AKfycby9XNFEBlTBkNBCiTxGMRmwQ8Y6J93E7w869xR3VTBx41Mow2POhMffDVzwUgCqjrR7iA/exec";


// ======================================
// VARIABEL
// ======================================

let scanner = null;
let sedangProses = false;


// ======================================
// STATUS
// ======================================

function setStatus(pesan, tipe) {

  const el =
    document.getElementById("status");

  el.innerHTML = pesan;

  el.className =
    "status " + (tipe || "info");
}


// ======================================
// MULAI SCANNER
// ======================================

function mulaiScanner() {

  if (scanner) {
    return;
  }

  sedangProses = false;

  document
    .getElementById("hasil")
    .classList
    .add("hidden");

  setStatus(
    "⏳ Membuka kamera...",
    "info"
  );

  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }
    },

    function(decodedText) {

      if (sedangProses) {
        return;
      }

      sedangProses = true;

      prosesQR(decodedText);

    },

    function(errorMessage) {

      // Abaikan error scanner sementara

    }

  )

  .then(function() {

    setStatus(
      "🟢 KAMERA AKTIF<br>Arahkan QR ke kotak",
      "success"
    );

  })

  .catch(function(error) {

    console.error(error);

    scanner = null;

    setStatus(
      "❌ Kamera gagal dibuka<br><br>" +
      error,
      "error"
    );

  });

}


// ======================================
// PROSES QR
// ======================================

function prosesQR(kode) {

  setStatus(
    "⏳ Memeriksa QR...",
    "info"
  );


  if (scanner) {

    scanner.stop()

    .then(function() {

      scanner.clear();

      scanner = null;

      kirimKeServer(kode);

    })

    .catch(function() {

      scanner = null;

      kirimKeServer(kode);

    });

  }

  else {

    kirimKeServer(kode);

  }

}


// ======================================
// KIRIM KE APPS SCRIPT
// ======================================

function kirimKeServer(kode) {

  const callbackName =
    "callbackAbsensi_" +
    Date.now();


  window[callbackName] =
    function(data) {

      tampilHasil(data);

      delete window[callbackName];

    };


  const script =
    document.createElement("script");


  script.src =
    API_URL +
    "?action=absen" +
    "&id=" +
    encodeURIComponent(kode) +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      setStatus(
        "❌ Tidak dapat terhubung ke server.",
        "error"
      );

      delete window[callbackName];

      setTimeout(
        resetScanner,
        3000
      );

    };


  document.body.appendChild(script);

}


// ======================================
// HASIL ABSENSI
// ======================================

function tampilHasil(data) {

  const hasil =
    document.getElementById("hasil");


  hasil.classList.remove("hidden");


  if (data.success) {

    setStatus(
      "✅ ABSENSI BERHASIL",
      "success"
    );


    hasil.innerHTML = `

      <div><b>ID:</b> ${escapeHtml(data.id)}</div>

      <div><b>Nama:</b> ${escapeHtml(data.nama)}</div>

      <div><b>Kelas:</b> ${escapeHtml(data.kelas)}</div>

      <div><b>Tanggal:</b> ${escapeHtml(data.tanggal)}</div>

      <div><b>Jam:</b> ${escapeHtml(data.jam)}</div>

    `;

  }

  else if (data.duplicate) {

    setStatus(
      "❌ SUDAH ABSEN",
      "warning"
    );


    hasil.innerHTML = `

      <div>
        <b>Nama:</b>
        ${escapeHtml(data.nama)}
      </div>

      <div>
        <b>Kelas:</b>
        ${escapeHtml(data.kelas)}
      </div>

      <div>
        <b>Status:</b>
        Sudah melakukan absensi hari ini.
      </div>

    `;

  }

  else {

    setStatus(
      "❌ ABSENSI GAGAL",
      "error"
    );


    hasil.innerHTML = `

      <div>
        ${escapeHtml(
          data.message ||
          "QR tidak valid."
        )}
      </div>

    `;

  }


  setTimeout(
    resetScanner,
    3500
  );

}


// ======================================
// SCAN LAGI
// ======================================

function resetScanner() {

  document
    .getElementById("hasil")
    .classList
    .add("hidden");

  sedangProses = false;

  setStatus(
    "📷 Siap scan siswa berikutnya.",
    "info"
  );

  mulaiScanner();

}


// ======================================
// KEAMANAN HTML
// ======================================

function escapeHtml(text) {

  if (
    text === undefined ||
    text === null
  ) {
    return "";
  }

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
