<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Absensi QR</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
}

.container {
    max-width: 500px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,.12);
}

h1 {
    text-align: center;
    margin: 5px 0;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 20px;
}

#reader {
    width: 100%;
}

.status {
    margin-top: 15px;
    padding: 15px;
    border-radius: 12px;
    text-align: center;
    font-weight: bold;
}

.info {
    background: #dbeafe;
    color: #1e40af;
}

.success {
    background: #dcfce7;
    color: #166534;
}

.error {
    background: #fee2e2;
    color: #991b1b;
}

.warning {
    background: #fef3c7;
    color: #92400e;
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 14px;
    border: 0;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 17px;
    font-weight: bold;
}

.hasil {
    margin-top: 15px;
    padding: 15px;
    background: #f8fafc;
    border-radius: 10px;
    line-height: 1.8;
}

.hidden {
    display: none;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>📋 ABSENSI QR</h1>

<div class="subtitle">
Scan QR siswa untuk melakukan absensi
</div>

<div id="reader"></div>

<div id="status"
class="status info">

📷 Tekan tombol MULAI KAMERA

</div>

<div id="hasil"
class="hasil hidden">
</div>

<button
id="startButton"
onclick="startCamera()">

📷 MULAI KAMERA

</button>

</div>

</div>


<script>

/*
====================================================
URL APPS SCRIPT BARU
====================================================
*/

const API_URL =
"https://script.google.com/macros/s/AKfycbwd3HoNTw4igYBKxjsJoNuQtWQmprQuSAcj32nLiUl3hYZU61Yb14LbTXnIq-5IwYYgdg/exec";


let qrScanner = null;

let sudahScan = false;


/*
====================================================
STATUS
====================================================
*/

function setStatus(text, type) {

    const status =
    document.getElementById("status");

    status.innerHTML = text;

    status.className =
    "status " + type;
}


/*
====================================================
START CAMERA
====================================================
*/

function startCamera() {

    if (qrScanner !== null) {
        return;
    }

    sudahScan = false;

    setStatus(
        "⏳ Meminta akses kamera...",
        "info"
    );

    qrScanner =
    new Html5Qrcode("reader");


    qrScanner.start(

        {
            facingMode: "environment"
        },

        {
            fps: 10,

            qrbox: {
                width: 250,
                height: 250
            }
        },

        function(decodedText) {

            if (sudahScan) {
                return;
            }

            sudahScan = true;

            console.log(
                "QR TERBACA:",
                decodedText
            );

            prosesQR(decodedText);

        },

        function(errorMessage) {

            // Error pembacaan QR diabaikan

        }

    )

    .then(function() {

        setStatus(
            "🟢 KAMERA AKTIF<br>" +
            "Arahkan QR ke kotak",
            "success"
        );

    })

    .catch(function(error) {

        console.error(
            "Camera error:",
            error
        );

        qrScanner = null;

        setStatus(
            "❌ KAMERA GAGAL DIBUKA<br><br>" +
            "Error: " +
            error,
            "error"
        );

    });

}


/*
====================================================
PROSES QR
====================================================
*/

function prosesQR(kode) {

    setStatus(
        "⏳ QR TERBACA<br>" +
        "Mengirim data ke server...",
        "info"
    );


    if (qrScanner) {

        qrScanner.stop()

        .then(function() {

            qrScanner.clear();

            qrScanner = null;

            kirimServer(kode);

        })

        .catch(function() {

            qrScanner = null;

            kirimServer(kode);

        });

    }

    else {

        kirimServer(kode);

    }

}


/*
====================================================
KIRIM KE APPS SCRIPT
====================================================
*/

function kirimServer(kode) {

    const callbackName =
        "absensiCallback_" +
        Date.now();


    window[callbackName] =
    function(data) {

        console.log(
            "RESPON SERVER:",
            data
        );

        tampilkanHasil(data);

        delete window[callbackName];

    };


    const script =
        document.createElement("script");


    script.src =
        API_URL +
        "?action=absen" +
        "&id=" +
        encodeURIComponent(kode) +
        "&callback=" +
        callbackName;


    script.onerror =
    function() {

        setStatus(
            "❌ TIDAK DAPAT TERHUBUNG KE SERVER",
            "error"
        );

        delete window[callbackName];

        setTimeout(
            siapScanLagi,
            3000
        );

    };


    document.body.appendChild(script);

}


/*
====================================================
HASIL
====================================================
*/

function tampilkanHasil(data) {

    const hasil =
    document.getElementById("hasil");


    hasil.classList.remove("hidden");


    if (data.success) {

        setStatus(
            "✅ ABSENSI BERHASIL",
            "success"
        );


        hasil.innerHTML =

        "<b>ID:</b> " +
        aman(data.id) +

        "<br><b>Nama:</b> " +
        aman(data.nama) +

        "<br><b>Kelas:</b> " +
        aman(data.kelas) +

        "<br><b>Tanggal:</b> " +
        aman(data.tanggal) +

        "<br><b>Jam:</b> " +
        aman(data.jam);

    }


    else if (data.duplicate) {

        setStatus(
            "❌ SUDAH ABSEN",
            "warning"
        );


        hasil.innerHTML =

        "<b>Nama:</b> " +
        aman(data.nama) +

        "<br><b>Kelas:</b> " +
        aman(data.kelas) +

        "<br><br>" +

        "Siswa sudah melakukan " +
        "absensi hari ini.";

    }


    else {

        setStatus(
            "❌ ABSENSI GAGAL",
            "error"
        );


        hasil.innerHTML =
        aman(
            data.message ||
            "QR tidak valid"
        );

    }


    setTimeout(
        siapScanLagi,
        4000
    );

}


/*
====================================================
SCAN LAGI
====================================================
*/

function siapScanLagi() {

    document
    .getElementById("hasil")
    .classList
    .add("hidden");


    sudahScan = false;


    setStatus(
        "📷 Siap melakukan scan berikutnya",
        "info"
    );

}


/*
====================================================
AMAN
====================================================
*/

function aman(text) {

    if (
        text === undefined ||
        text === null
    ) {
        return "";
    }

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

</script>

</body>

</html>
