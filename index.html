<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TEST SERVER</title>
</head>

<body>

<h2>TEST KONEKSI SERVER</h2>

<button onclick="testServer()">
TES SERVER
</button>

<div id="hasil" style="margin-top:20px;font-size:20px;"></div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbwd3HoNTw4igYBKxjsJoNuQtWQmprQuSAcj32nLiUl3hYZU61Yb14LbTXnIq-5IwYYgdg/exec";


function testServer() {

    document.getElementById("hasil").innerHTML =
        "⏳ Menghubungkan...";


    const callback =
        "hasilServer_" + Date.now();


    window[callback] = function(data) {

        document.getElementById("hasil").innerHTML =
            "<b>✅ SERVER TERHUBUNG</b><br><br>" +
            JSON.stringify(data);

        console.log(data);

    };


    const script =
        document.createElement("script");


    script.src =
        API_URL +
        "?action=absen" +
        "&id=TEST001" +
        "&callback=" +
        callback;


    script.onerror = function() {

        document.getElementById("hasil").innerHTML =
            "<b>❌ SERVER GAGAL</b><br><br>" +
            "Script gagal dimuat.";

    };


    document.body.appendChild(script);

}

</script>

</body>
</html>
