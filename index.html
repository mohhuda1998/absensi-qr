<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Absensi QR</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
}

.container {
    max-width: 500px;
    margin: auto;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 18px;
    box-shadow: 0 4px 15px rgba(0,0,0,.12);
}

h1 {
    text-align: center;
    margin: 5px 0;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 15px;
}

#reader {
    width: 100%;
    margin-top: 15px;
}

.status {
    margin-top: 15px;
    padding: 15px;
    border-radius: 12px;
    text-align: center;
    font-weight: bold;
}

.info {
    background: #dbeafe;
    color: #1e40af;
}

.success {
    background: #dcfce7;
    color: #166534;
}

.error {
    background: #fee2e2;
    color: #991b1b;
}

.warning {
    background: #fef3c7;
    color: #92400e;
}

.hasil {
    margin-top: 15px;
    padding: 15px;
    border-radius: 12px;
    background: #f8fafc;
    line-height: 1.8;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border: 0;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 17px;
    font-weight: bold;
}

.hidden {
    display: none;
}

.qr-code {
    font-size: 22px;
    font-weight: bold;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>📋 ABSENSI QR</h1>

<div class="subtitle">
Kamera LIVE • Scan QR otomatis
</div>

<div id="reader"></div>

<div id="status"
     class="status info">

📷 Tekan tombol MULAI KAMERA

</div>

<div id="hasil"
     class="hasil hidden">
</div>

<button
    id="startButton"
    onclick="mulaiKamera()">

📷 MULAI KAMERA

</button>

</div>

</div>


<script>

/*
====================================================
APPS SCRIPT
====================================================
*/

const API_URL =
"https://script.google.com/macros/s/AKfycbwd3HoNTw4igYBKxjsJoNuQtWQmprQuSAcj32nLiUl3hYZU61Yb14LbTXnIq-5IwYYgdg/exec";


/*
====================================================
VARIABEL
====================================================
*/

let scanner = null;

let kameraAktif = false;

let sedangProses = false;

let qrTerakhir = "";

let waktuScanTerakhir = 0;


/*
====================================================
STATUS
====================================================
*/

function status(text, tipe) {

    const el =
        document.getElementById("status");

    el.innerHTML = text;

    el.className =
        "status " + tipe;
}


/*
====================================================
MULAI KAMERA
====================================================
*/

function mulaiKamera() {

    if (kameraAktif) {
        return;
    }


    status(
        "⏳ Membuka kamera...",
        "info"
    );


    scanner =
        new Html5Qrcode("reader");


    const config = {

        fps: 10,

        qrbox: {
            width: 250,
            height: 250
        }

    };


    scanner.start(

        {
            facingMode: "environment"
        },

        config,

        function(decodedText) {

            bacaQR(decodedText);

        },

        function(errorMessage) {

            // Error scan diabaikan

        }

    )

    .then(function() {

        kameraAktif = true;

        status(
            "🟢 KAMERA LIVE<br>" +
            "Arahkan QR ke kotak",
            "success"
        );


        document
            .getElementById("startButton")
            .style.display = "none";

    })

    .catch(function(error) {

        console.error(error);

        scanner = null;

        /*
        ============================================
        FALLBACK CAMERA
        ============================================
        */

        bukaKameraFallback();

    });

}


/*
====================================================
FALLBACK CAMERA
====================================================
*/

function bukaKameraFallback() {

    status(
        "⏳ Mencari kamera...",
        "info"
    );


    Html5Qrcode
        .getCameras()

        .then(function(cameras) {

            if (
                !cameras ||
                cameras.length === 0
            ) {

                status(
                    "❌ Kamera tidak ditemukan",
                    "error"
                );

                return;
            }


            scanner =
                new Html5Qrcode("reader");


            scanner.start(

                cameras[0].id,

                {
                    fps: 10,

                    qrbox: {
                        width: 250,
                        height: 250
                    }
                },

                function(decodedText) {

                    bacaQR(decodedText);

                },

                function(errorMessage) {

                    // abaikan

                }

            )

            .then(function() {

                kameraAktif = true;

                status(
                    "🟢 KAMERA LIVE<br>" +
                    "Arahkan QR ke kotak",
                    "success"
                );


                document
                    .getElementById("startButton")
                    .style.display = "none";

            })

            .catch(function(error) {

                scanner = null;

                status(
                    "❌ Kamera gagal dibuka<br><br>" +
                    error,
                    "error"
                );

            });

        })

        .catch(function(error) {

            status(
                "❌ Tidak dapat mengakses kamera<br><br>" +
                error,
                "error"
            );

        });

}


/*
====================================================
QR TERBACA
====================================================
*/

function bacaQR(kode) {

    const sekarang =
        Date.now();


    /*
    Jangan proses QR yang sama
    berulang-ulang dalam 3 detik.
    */

    if (
        kode === qrTerakhir &&
        sekarang - waktuScanTerakhir < 3000
    ) {

        return;

    }


    /*
    Jika server sedang memproses,
    jangan menerima QR baru.
    */

    if (sedangProses) {

        return;

    }


    qrTerakhir = kode;

    waktuScanTerakhir = sekarang;

    sedangProses = true;


    console.log(
        "QR TERBACA:",
        kode
    );


    /*
    Tampilkan QR
    */

    const hasil =
        document.getElementById("hasil");


    hasil.classList.remove("hidden");


    hasil.innerHTML =

        "<b>QR TERBACA</b><br>" +

        "<span class='qr-code'>" +
        aman(kode) +
        "</span><br><br>" +

        "⏳ Menghubungkan ke server...";


    status(
        "🔲 QR TERBACA<br>" +
        "☁️ Mengirim ke server...",
        "info"
    );


    /*
    LANGSUNG KIRIM KE SERVER
    KAMERA TETAP LIVE
    */

    kirimKeServer(kode);

}


/*
====================================================
KIRIM KE APPS SCRIPT
====================================================
*/

function kirimKeServer(kode) {

    const callbackName =
        "absensiCallback_" +
        Date.now();


    /*
    Callback JSONP
    */

    window[callbackName] =
        function(data) {

            console.log(
                "RESPON SERVER:",
                data
            );


            tampilkanHasil(data);


            try {

                delete window[callbackName];

            } catch (e) {}

        };


    /*
    Buat script request
    */

    const script =
        document.createElement("script");


    script.src =
        API_URL +

        "?action=absen" +

        "&id=" +
        encodeURIComponent(kode) +

        "&callback=" +
        encodeURIComponent(callbackName);


    /*
    Timeout
    */

    let selesai = false;


    const timer =
        setTimeout(function() {

            if (selesai) {
                return;
            }


            selesai = true;


            status(
                "❌ SERVER TIDAK MERESPONS",
                "error"
            );


            const hasil =
                document.getElementById("hasil");


            hasil.classList.remove("hidden");


            hasil.innerHTML =

                "<b>QR:</b> " +
                aman(kode) +

                "<br><br>" +

                "Server tidak memberikan respons.";


            sedangProses = false;


            try {

                delete window[callbackName];

            } catch (e) {}


        }, 10000);


    /*
    Callback wrapper
    */

    const callbackAsli =
        window[callbackName];


    window[callbackName] =
        function(data) {

            if (selesai) {
                return;
            }


            selesai = true;

            clearTimeout(timer);


            callbackAsli(data);

        };


    /*
    Jika request gagal
    */

    script.onerror =
        function() {

            if (selesai) {
                return;
            }


            selesai = true;

            clearTimeout(timer);


            status(
                "❌ TIDAK DAPAT TERHUBUNG KE SERVER",
                "error"
            );


            const hasil =
                document.getElementById("hasil");


            hasil.classList.remove("hidden");


            hasil.innerHTML =

                "<b>QR:</b> " +
                aman(kode) +

                "<br><br>" +

                "Koneksi ke Apps Script gagal.";


            sedangProses = false;


            try {

                delete window[callbackName];

            } catch (e) {}

        };


    document.body.appendChild(script);

}


/*
====================================================
HASIL DARI SERVER
====================================================
*/

function tampilkanHasil(data) {

    const hasil =
        document.getElementById("hasil");


    hasil.classList.remove("hidden");


    /*
    ================================================
    BERHASIL
    ================================================
    */

    if (data.success) {

        status(
            "✅ ABSENSI BERHASIL<br>" +
            "KAMERA TETAP LIVE",
            "success"
        );


        hasil.innerHTML =

            "<b>✅ ABSENSI BERHASIL</b><br><br>" +

            "<b>ID:</b> " +
            aman(data.id) +

            "<br>" +

            "<b>Nama:</b> " +
            aman(data.nama) +

            "<br>" +

            "<b>Kelas:</b> " +
            aman(data.kelas) +

            "<br>" +

            "<b>Tanggal:</b> " +
            aman(data.tanggal) +

            "<br>" +

            "<b>Jam:</b> " +
            aman(data.jam);


    }


    /*
    ================================================
    DUPLIKAT
    ================================================
    */

    else if (data.duplicate) {

        status(
            "⚠️ SUDAH ABSEN<br>" +
            "KAMERA TETAP LIVE",
            "warning"
        );


        hasil.innerHTML =

            "<b>⚠️ ABSEN GANDA</b><br><br>" +

            "<b>ID:</b> " +
            aman(data.id) +

            "<br>" +

            "<b>Nama:</b> " +
            aman(data.nama) +

            "<br>" +

            "<b>Kelas:</b> " +
            aman(data.kelas) +

            "<br><br>" +

            "Siswa sudah melakukan " +
            "absensi hari ini.";


    }


    /*
    ================================================
    GAGAL
    ================================================
    */

    else {

        status(
            "❌ ABSENSI GAGAL<br>" +
            "KAMERA TETAP LIVE",
            "error"
        );


        hasil.innerHTML =

            "<b>QR:</b> " +
            aman(data.id) +

            "<br><br>" +

            aman(
                data.message ||
                "Data tidak valid."
            );

    }


    /*
    ================================================
    SIAP SCAN BERIKUTNYA
    ================================================
    */

    setTimeout(function() {

        hasil.classList.add("hidden");

        sedangProses = false;

        status(
            "🟢 KAMERA LIVE<br>" +
            "Silakan scan QR berikutnya",
            "success"
        );

    }, 3000);

}


/*
====================================================
AMANKAN TEXT
====================================================
*/

function aman(text) {

    if (
        text === undefined ||
        text === null
    ) {

        return "";

    }


    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

</script>

</body>
</html>
