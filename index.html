<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Absensi QR</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
}

.container {
    max-width: 500px;
    margin: auto;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,.12);
}

h2 {
    text-align: center;
    margin-top: 0;
}

#reader {
    width: 100%;
    overflow: hidden;
    border-radius: 12px;
}

.status {
    margin-top: 15px;
    padding: 14px;
    border-radius: 10px;
    text-align: center;
    font-weight: bold;
}

.info {
    background: #dbeafe;
    color: #1e40af;
}

.success {
    background: #dcfce7;
    color: #166534;
}

.error {
    background: #fee2e2;
    color: #991b1b;
}

.warning {
    background: #fef3c7;
    color: #92400e;
}

.hasil {
    margin-top: 15px;
    padding: 15px;
    border-radius: 10px;
    background: #f8fafc;
    line-height: 1.8;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border: 0;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 17px;
    font-weight: bold;
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h2>📋 ABSENSI QR</h2>

<div id="reader"></div>

<div id="status" class="status info">
📷 Tekan tombol untuk membuka kamera
</div>

<div id="hasil" class="hasil hidden"></div>

<button id="btnMulai" onclick="mulaiKamera()">
📷 MULAI KAMERA
</button>

</div>

</div>


<script>

/* =====================================================
   URL APPS SCRIPT
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbwd3HoNTw4igYBKxjsJoNuQtWQmprQuSAcj32nLiUl3hYZU61Yb14LbTXnIq-5IwYYgdg/exec";


let scanner = null;

let kameraAktif = false;

let sedangProses = false;

let qrTerakhir = "";


/* =====================================================
   STATUS
===================================================== */

function status(text, type) {

    const el =
        document.getElementById("status");

    el.innerHTML = text;

    el.className =
        "status " + type;
}


/* =====================================================
   MULAI KAMERA
===================================================== */

function mulaiKamera() {

    if (kameraAktif) {
        return;
    }

    status(
        "⏳ Membuka kamera...",
        "info"
    );

    scanner =
        new Html5Qrcode("reader");


    scanner.start(

        {
            facingMode: {
                exact: "environment"
            }
        },

        {
            fps: 10,

            qrbox: {
                width: 250,
                height: 250
            }
        },

        function(decodedText) {

            if (sedangProses) {
                return;
            }

            prosesQR(decodedText);

        },

        function(errorMessage) {

            // Error scan diabaikan

        }

    )

    .then(function() {

        kameraAktif = true;

        status(
            "🟢 KAMERA LIVE<br>Arahkan QR ke kotak",
            "success"
        );

        document
            .getElementById("btnMulai")
            .style.display = "none";

    })

    .catch(function(error) {

        status(
            "❌ KAMERA GAGAL DIBUKA<br><br>" +
            error,
            "error"
        );

        console.error(error);

    });

}


/* =====================================================
   QR TERBACA
===================================================== */

function prosesQR(kode) {

    kode =
        String(kode).trim();


    if (!kode) {
        return;
    }


    if (kode === qrTerakhir) {
        return;
    }


    qrTerakhir =
        kode;

    sedangProses = true;


    const hasil =
        document.getElementById("hasil");

    hasil.classList.remove("hidden");


    hasil.innerHTML =

        "<b>🔲 QR TERBACA</b><br><br>" +

        "ID: <b>" +
        escapeHTML(kode) +
        "</b><br><br>" +

        "☁️ Menghubungkan ke server...";


    status(
        "☁️ MENGIRIM KE SERVER...",
        "info"
    );


    kirimKeServer(kode);

}


/* =====================================================
   KIRIM KE APPS SCRIPT
===================================================== */

function kirimKeServer(kode) {

    const namaCallback =
        "callbackAbsensi_" +
        Date.now();


    let selesai = false;


    /* ================================================
       CALLBACK
    ================================================ */

    window[namaCallback] =
        function(data) {

            if (selesai) {
                return;
            }

            selesai = true;


            console.log(
                "RESPON APPS SCRIPT:",
                data
            );


            tampilkanHasil(data);


            try {

                delete window[namaCallback];

            } catch(e) {}

        };


    /* ================================================
       SCRIPT
    ================================================ */

    const script =
        document.createElement("script");


    script.src =
        API_URL +
        "?action=absen" +
        "&id=" +
        encodeURIComponent(kode) +
        "&callback=" +
        namaCallback;


    script.async = true;


    /* ================================================
       ERROR
    ================================================ */

    script.onerror =
        function() {

            if (selesai) {
                return;
            }

            selesai = true;


            console.error(
                "Apps Script tidak dapat dimuat"
            );


            status(
                "❌ TIDAK DAPAT TERHUBUNG KE SERVER",
                "error"
            );


            document
                .getElementById("hasil")
                .innerHTML =

                "<b>QR:</b> " +
                escapeHTML(kode) +

                "<br><br>" +

                "Koneksi ke Apps Script gagal.";


            sedangProses = false;

        };


    document.body.appendChild(script);


    /* ================================================
       TIMEOUT
    ================================================ */

    setTimeout(function() {

        if (selesai) {
            return;
        }

        console.log(
            "Menunggu respons Apps Script..."
        );

    }, 10000);

}


/* =====================================================
   TAMPILKAN HASIL
===================================================== */

function tampilkanHasil(data) {

    const hasil =
        document.getElementById("hasil");


    if (data.success) {

        status(
            "✅ ABSENSI BERHASIL",
            "success"
        );


        hasil.innerHTML =

            "<b>✅ ABSENSI BERHASIL</b><br><br>" +

            "ID: " +
            escapeHTML(data.id) +

            "<br>" +

            "Nama: " +
            escapeHTML(data.nama) +

            "<br>" +

            "Kelas: " +
            escapeHTML(data.kelas) +

            "<br>" +

            "Tanggal: " +
            escapeHTML(data.tanggal) +

            "<br>" +

            "Jam: " +
            escapeHTML(data.jam);

    }

    else if (data.duplicate) {

        status(
            "⚠️ SUDAH ABSEN",
            "warning"
        );


        hasil.innerHTML =

            "<b>⚠️ SUDAH ABSEN HARI INI</b><br><br>" +

            "Nama: " +
            escapeHTML(data.nama) +

            "<br>" +

            "Kelas: " +
            escapeHTML(data.kelas);

    }

    else {

        status(
            "❌ ABSENSI GAGAL",
            "error"
        );


        hasil.innerHTML =

            "<b>❌ ABSENSI GAGAL</b><br><br>" +

            escapeHTML(
                data.message ||
                "Data tidak ditemukan"
            );

    }


    /* ================================================
       SIAP SCAN LAGI
    ================================================ */

    setTimeout(function() {

        sedangProses = false;

        qrTerakhir = "";

        hasil.classList.add("hidden");

        status(
            "🟢 KAMERA LIVE<br>Silakan scan QR berikutnya",
            "success"
        );

    }, 3000);

}


/* =====================================================
   AMANKAN TEKS
===================================================== */

function escapeHTML(text) {

    if (
        text === undefined ||
        text === null
    ) {

        return "";

    }

    return String(text)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
